version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "13:00"
      timezone: Europe/Berlin
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "13:00"
      timezone: Europe/Berlin
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
